<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LSBUD Member Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--b:#07264E;--r:#CC0001;--y:#FFD21F;--m:#5d6b7e;--l:#e3e8ee}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font:14px/1.5 Figtree,Arial,sans-serif;background:#f3f5f8;color:#1c2b3f}
h1{font:400 30px/1.2 "DM Serif Display",Georgia,serif;color:var(--b)}
h2{font-size:15px;font-weight:600;color:var(--b);margin-bottom:12px}
.sub{color:var(--m);margin:2px 0 22px}
button,input,select,textarea{font:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cdd5df;border-radius:6px;background:#fff}
:focus-visible{outline:2px solid var(--b);outline-offset:1px}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}
.btn{background:var(--b);color:#fff;border:0;border-radius:6px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn:hover{background:#0d3a75}.btn.o{background:#fff;color:var(--b);border:1px solid var(--b)}.btn.o:hover{background:#eef3f8}.btn.s{padding:5px 11px;font-size:12px}
.lg{display:inline-block;font:800 1em/1 Arial,Helvetica,sans-serif;letter-spacing:-.04em;color:var(--b)}.lg u{text-decoration:none;color:var(--r)}
.st{display:block;width:0;min-width:100%;margin-top:.3em;font-size:.15em;font-weight:400;letter-spacing:.2em;text-align:justify;text-align-last:justify}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--b)}
.auth form{background:#fff;width:100%;max-width:420px;padding:36px;border-radius:12px;position:relative}
.err{color:var(--r);font-size:13px;margin-top:10px;min-height:20px}.hint{color:var(--m);font-size:12px;margin-top:8px}
.code{font-size:26px;letter-spacing:10px;text-align:center}
#ap{display:flex}
.sb{width:240px;background:var(--b);color:#d3dcea;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.sb .lg{color:#fff}.sbh{padding:24px 22px 20px}
.sb a{display:flex;gap:12px;padding:12px 22px;cursor:pointer;border-left:3px solid transparent}
.sb a:hover,.sb a.on{background:#ffffff1a;color:#fff}.sb a.on{border-color:var(--y)}
.sb span{width:18px;text-align:center}.sb>a{margin-top:auto;border-top:1px solid #fff3}
.col{flex:1;min-width:0}
.top{background:#fff;padding:10px 28px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top select{width:auto;padding:5px 8px}#bg{display:none}
main{padding:28px}
.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 6px #0001;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px}.grid .card{margin:0}
.k small{color:var(--m)}.k b{display:block;font:400 32px/1.2 "DM Serif Display",Georgia,serif;color:var(--b)}.k em{font-style:normal;font-size:12px;color:var(--m)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:20px;margin-bottom:20px}.two .card{margin:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}.row label{margin-top:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--m);font-weight:600;padding:10px;border-bottom:2px solid var(--l)}
td{padding:10px;border-bottom:1px solid var(--l)}
.pill{padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:#e4ebf4;color:var(--b)}
.pill.g{background:var(--b);color:#fff}.pill.r{background:#fbe3e3;color:var(--r)}.pill.y{background:#fff1b8;color:#5c4700}
.act{list-style:none}.act li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--l)}.act small{color:var(--m);white-space:nowrap}
.pm{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.ch svg{width:100%}.ch text{font-size:9px;fill:var(--m)}
.bars{display:flex;gap:10px;height:170px;padding-top:18px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--m)}
.bars b{width:100%;background:var(--b);border-radius:4px 4px 0 0;position:relative;display:block}.bars b.mx{background:var(--r)}
.bars i{position:absolute;top:-16px;width:100%;text-align:center;font-style:normal;color:#1c2b3f}
.mp{display:grid;grid-template-columns:1fr 300px;gap:20px}
.mc{padding:0;overflow:hidden;position:relative;height:calc(100vh - 220px);min-height:440px;margin:0}
.mc svg{width:100%;height:100%;display:block}circle{cursor:pointer}
#g{transform-origin:50% 50%;transition:transform .3s}
.no-s .t-s,.no-e .t-e,.no-a .t-a{display:none}
@keyframes p{50%{opacity:.35}}.t-a{animation:p 1.6s infinite}
.mb{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.mb>*{pointer-events:auto;background:#fff;padding:6px 12px;border-radius:20px;box-shadow:0 1px 6px #0003;font-size:12px;display:flex;gap:6px;align-items:center;cursor:pointer;font-weight:600;margin:0}
.mb input{width:auto}.mb i{width:10px;height:10px;border-radius:50%;display:inline-block}
.zm{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.zm button{width:34px;height:34px;border:0;border-radius:6px;background:#fff;box-shadow:0 1px 6px #0003;font-size:18px;cursor:pointer}
.tag{position:absolute;left:12px;bottom:12px;background:#fffe;padding:4px 10px;border-radius:6px;font-size:12px;color:var(--m)}
.mt{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--l)}.mt span{width:10px;height:10px;border-radius:50%}.mt b{margin-left:auto}
.dz{display:block;border:2px dashed #b9c5d6;border-radius:10px;padding:18px;text-align:center;cursor:pointer;margin:0 0 14px;font-weight:400}
.dz.dg,.dz:hover{border-color:var(--b);background:#eef3f9}.dz b{display:block;color:var(--b);font-size:14px}.dz small{display:block;margin-top:6px;color:var(--m)}
.dz p{margin:8px 0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.rp{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}.rp>.card{margin:0}
.cl{background:#fff;border-radius:10px;padding:14px 8px;box-shadow:0 1px 6px #0001}
.cl h3{font-size:12px;color:var(--m);padding:6px 12px;font-weight:600}
.cl a{display:block;padding:8px 12px;border-radius:6px;cursor:pointer}.cl a:hover{background:#eef2f7}.cl a.on{background:#e4ebf4;color:var(--b);font-weight:600}
.cl input{margin:0 4px 10px;width:calc(100% - 8px);padding:7px 10px}
.fw{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.fw label{margin:0;display:flex;align-items:center;gap:6px;border:1px solid var(--l);padding:3px 12px;border-radius:20px;font-size:12px}.fw input{border:0;padding:2px;width:auto}
.rh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph{border:2px dashed #b9c5d6;border-radius:10px;padding:32px;text-align:center;color:var(--m);margin-top:12px}.ph b{color:var(--b);font-size:16px}.ph p{margin:8px auto 14px;max-width:520px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--b);color:#fff;padding:12px 18px;border-radius:8px;opacity:0;transform:translateY(20px);transition:.3s;pointer-events:none;z-index:99;max-width:340px}.toast.on{opacity:1;transform:none}
@media(max-width:900px){.sb{position:fixed;z-index:20;left:-250px;transition:left .25s}.sb.open{left:0}#bg{display:inline-block}main{padding:18px}.top{padding:10px 18px}.mp,.rp{grid-template-columns:1fr}.mc{height:60vh}}
@media(max-width:600px){#sr{display:none}}
@media print{body *{visibility:hidden}#rep,#rep *{visibility:visible}#rep{position:absolute;left:0;top:0;width:100%}.np{display:none!important}}
</style></head><body>

<svg id="sr" viewBox="0 0 100 100" style="position:fixed;top:28px;right:36px;width:90px"><polygon fill="#FFD21F" points="50,2 61.8,33.8 95.6,35.2 69,56.2 78.2,88.8 50,70 21.8,88.8 31,56.2 4.4,35.2 38.2,33.8"/><path d="M37 41l13 21 13-21" fill="none" stroke="#07264E" stroke-width="7"/></svg>

<div class="auth" id="li"><form onsubmit="login(event)">
<div data-logo style="font-size:46px;margin-bottom:24px"></div><h2>Sign in</h2>
<label>Company email address</label><input id="em" type="email" required autocomplete="username" placeholder="name@company.co.uk">
<label>Password</label><input id="pw" type="password" required autocomplete="current-password">
<button class="btn" style="width:100%;margin-top:20px">Login</button><div class="err" id="e1"></div>
<p class="hint">Demo: use <b>admin@cadentgas.com</b> or <b>operator@cadentgas.com</b> with any password.</p></form></div>

<div class="auth" id="mf" hidden><form onsubmit="mfa(event)">
<div data-logo style="font-size:46px;margin-bottom:24px"></div><h2>Two-factor authentication</h2>
<p>Enter the 6-digit code from your authenticator app.</p>
<label>Verification code</label><input id="cd" class="code" inputmode="numeric" maxlength="6" pattern="\d{6}" required autocomplete="one-time-code" placeholder="000000">
<button class="btn" style="width:100%;margin-top:20px">Verify</button>
<button type="button" class="btn o" style="width:100%;margin-top:10px" onclick="show('li')">Back to login</button>
<div class="err" id="e2"></div><p class="hint">Demo code: 123456</p></form></div>

<div id="ap" hidden>
<aside class="sb" id="sb"><div class="sbh" data-logo style="font-size:32px"></div><nav id="nv"></nav><a onclick="out()"><span>➜</span>Logout</a></aside>
<div class="col"><header class="top"><button id="bg" class="btn o s" onclick="$('#sb').classList.toggle('open')">☰ Menu</button><b id="cn" style="color:var(--b)"></b><span style="flex:1"></span><small>View as</small><select id="vs" onchange="va(this.value)"><option>Admin<option>Operator</select><span id="ui"></span></header><main id="mn"></main></div>
</div>
<div class="toast" id="ts"></div>

<script>
/* LOGO: swap this string for <img src="LSBUD_RGB_LOGO.png" alt="LSBUD" style="height:1em"> to use the official artwork. */
const LOGO='<span class="lg">LSB<u>U</u>D<span class="st">SAFE DIGGING FOR <u>ALL</u></span></span>';
/* MBU: paste the signed Metabase embed URL here once LSBUD IT supplies the security key. */
const MBU='';
document.querySelectorAll('[data-logo]').forEach(e=>e.innerHTML=LOGO);

const $=s=>document.querySelector(s),n=(a,b)=>a+Math.random()*(b-a)|0,pk=a=>a[n(0,a.length)],
esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),
fd=d=>d.toLocaleDateString('en-GB',{timeZone:'UTC'}),fz=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.ceil(b/1e3)+' KB',
P=(t,c)=>`<span class="pill ${c||''}">${t}</span>`,SC={Disabled:'r',Open:'y'},
MO=['May','Jun','Jul','Aug','Sep','Oct'];
let co='Cadent Gas',me,pg='dash',z=1,RR,RK,tm,st={lg:412,rp:37,sr:18642,mp:6310},UP=[],
U=[['John Smith','john.smith@cadentgas.com','Admin','Today','Active',28],['Sarah Jones','sarah.jones@cadentgas.com','Operator','Yesterday','Active',19],['Mark Taylor','mark.taylor@cadentgas.com','Operator','3 days ago','Active',11],['Emma Clarke','emma.clarke@cadentgas.com','Admin','Today','Active',24],['Dan Evans','dan.evans@cadentgas.com','Operator','2 weeks ago','Disabled',0]],
T=[['LSB-1041','Map layer not loading','High','In progress','08/10/2026'],['LSB-1042','Add a second administrator','Low','Closed','01/10/2026']],
A=[['<b>Sarah Jones</b> ran the Search Activity Report','12 min ago'],['<b>Mark Taylor</b> viewed the Elastic map','1 hr ago'],['<b>Emma Clarke</b> raised ticket LSB-1041','4 days ago'],['<b>John Smith</b> created operator Dan Evans','5 days ago']];
const NAV=[['dash','Dashboard','▦'],['map','Elastic Map','◎'],['users','User Management','☰',1],['stats','Usage Analytics','▲',1],['rep','Reports','▤'],['sup','Support','ⓘ'],['set','Settings','✱',1]],
PM=[['Access the Elastic map and dashboard',1],['Generate approved reports',1],['Raise support tickets',1],['View all usage statistics',2],['Create, disable and reset users',2],['Upload GIS data to the map',2],['Manage company settings',2]],
TY={s:['Searches','#2f6db5','Utility search'],e:['Excavations','#F5B800','Excavation notice'],a:['Alerts','#CC0001','Strike-risk alert']},
M=Array.from({length:44},(_,i)=>({x:n(50,850),y:n(60,510),t:pk('ssseea'),r:'REF-'+(48100+i),d:n(3,60),h:n(0,24)})),
MK=M.map((m,i)=>`<circle class="t-${m.t}" cx="${m.x}" cy="${m.y}" r="8" fill="${TY[m.t][1]}" stroke="#fff" stroke-width="2" onclick="inf(${i})"></circle>`).join(''),
BG=`<rect width="900" height="560" fill="#e8edf2"/><path d="M0 390C200 330 330 460 540 400S800 310 900 350" stroke="#c3d7ea" stroke-width="28" fill="none"/><rect x="400" y="130" width="100" height="60" rx="6" fill="#dbe6d9"/><rect x="660" y="340" width="120" height="80" rx="6" fill="#dbe6d9"/><g fill="none" stroke="#fff"><path stroke-width="8" d="M0 120H900M0 270H900M0 480H900M140 0V560M390 0V560M650 0V560"/><path stroke-width="3" d="M0 200H900M0 360H900M265 0V560M520 0V560M770 0V560"/></g><g fill="none" stroke="#07264E" stroke-width="4" stroke-dasharray="10 6"><path d="M20 120H390V480H830"/><path d="M140 20V270H650V540"/></g>`,
LOC=['M1 3BB','B2 4QA','NG1 5FS','LE1 6RE','CB2 1TN','N1 9GU'],
FT={zip:'Shapefile',shp:'Shapefile',shx:'Shapefile',dbf:'Shapefile',prj:'Shapefile',gpkg:'GeoPackage',kml:'KML'},
/* name, headers, row builder, approved for operators, chart column, description */
RT={usage:['Usage Report',['Date','Logins','Active users','Searches','Map views'],d=>[d,n(15,60),n(8,30),n(200,700),n(40,200)],0,1,'Portal logins, active users, searches and map views.'],
oper:['Operator Activity Report',['Operator','Logins','Searches','Reports run','Last login'],()=>U.map(u=>[esc(u[0]),u[5],n(20,400),n(0,12),u[3]]),0,2,'Individual operator activity.'],
srch:['Search Activity Report',['Date','Searches','Affecting assets','Top search area'],d=>{const s=n(200,700);return[d,s,n(10,s/5|0),pk(LOC)]},1,1,'Location searches across the selected date range.'],
asst:['Asset Activity Report',['Date','Searches affecting assets','Excavation notices','Strike-risk alerts','Nearest work (m)'],d=>[d,n(10,120),n(5,60),n(0,8),n(2,60)],1,1,'Searches and excavation activity affecting your assets.']};

/* helpers */
const H=(t,s)=>`<h1>${t}</h1><p class="sub">${s}</p>`,
TB=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}`).join('')}${r.map(x=>`<tr>${x.map(c=>`<td>${c}`).join('')}`).join('')}</table></div>`,
KP=a=>`<div class="grid">${a.map(x=>`<div class="card k"><small>${x[0]}</small><b>${x[1]}</b><em>${x[2]}</em></div>`).join('')}</div>`,
kp=()=>[['Operators',U.filter(u=>u[2]=='Operator').length,'Registered operators'],['Logins this month',st.lg,'Up 8% on last month'],['Active users',U.filter(u=>u[4]=='Active').length,'of '+U.length+' accounts'],['Searches',st.sr.toLocaleString(),'Up 12% on last month'],['Reports generated',st.rp,'This month'],['Support tickets',T.length,T.filter(t=>t[3]!='Closed').length+' open']],
AL=k=>`<ul class="act">${A.slice(0,k).map(a=>`<li><span>${a[0]}</span><small>${a[1]}</small>`).join('')}</ul>`,
LG=()=>[240,265,310,352,381,st.lg],
line=(d,l)=>{const m=Math.max(...d),k=Math.max(d.length-1,1),j=Math.ceil(d.length/7),p=d.map((v,i)=>[10+i*280/k,100-v/m*80]),s=p.map(q=>q.join()).join(' ');return `<svg viewBox="0 0 300 125"><polygon points="10,100 ${s} ${p[p.length-1][0]},100" fill="#07264E1f"/><polyline points="${s}" fill="none" stroke="#07264E" stroke-width="2.5"/>${p.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${d.length>12?2:3}" fill="${d[i]==m?'#CC0001':'#07264E'}"/>${i%j?'':`<text x="${q[0]}" y="116" text-anchor="middle">${l[i]}</text>`}${d.length<9?`<text x="${q[0]}" y="${q[1]-7}" text-anchor="middle">${d[i]}</text>`:''}`).join('')}</svg>`},
bars=(d,l)=>{const m=Math.max(...d);return `<div class="bars">${d.map((v,i)=>`<div><b${v==m?' class="mx"':''} style="height:${v/m*85}%"><i>${v.toLocaleString()}</i></b>${l[i]}</div>`).join('')}</div>`},
log=t=>A.unshift([`<b>${esc(me[0])}</b> ${t}`,'Just now']),
toast=m=>{const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),4000)},
show=x=>{['li','mf','ap'].forEach(i=>$('#'+i).hidden=i!=x);$('#sr').hidden=x=='ap'},
gis=()=>me[2]!='Admin'?'':`<div class="card"><h2>Your GIS data</h2><label class="dz" ondragover="event.preventDefault();this.classList.add('dg')" ondragleave="this.classList.remove('dg')" ondrop="event.preventDefault();add(event.dataTransfer.files)"><input type="file" multiple hidden accept=".zip,.shp,.shx,.dbf,.prj,.gpkg,.kml" onchange="add(this.files)"><b>Drop files here or browse</b><p>${P('Shapefile (.zip, or .shp with .shx .dbf .prj)')}${P('GeoPackage (.gpkg)')}${P('KML (.kml)')}</p><small>Maximum 100 MB per file</small></label>${UP.length?TB(['File','Status',''],UP.map((u,i)=>[esc(u.n)+`<br><small>${u.t}, ${u.z}</small>`,u.s,`<button class="btn o s" onclick="rmu(${i})">Remove</button>`])):''}<p class="hint">In this demo files stay in your browser. In production they are stored securely and published as Elastic Maps layers.</p></div>`;

/* views */
const V={
dash:()=>H('Executive Dashboard',esc(co)+' activity overview')+KP(kp())+`<div class="two"><div class="card ch"><h2>Logins per month</h2>${line(LG(),MO)}</div><div class="card"><h2>Latest activity</h2>${AL(6)}</div></div><div class="card"><h2>Your access as ${me[2]}</h2><div class="pm">${PM.map(p=>{const k=p[1]==1||me[2]=='Admin';return `<div><b style="color:${k?'var(--b)':'var(--r)'}">${k?'✓':'✕'}</b> ${p[0]}</div>`}).join('')}</div></div>`,

map:()=>{z=1;const N=t=>M.filter(m=>m.t==t).length,r=[...Object.keys(TY).map(k=>[TY[k][1],TY[k][0],N(k)]),['#07264E','Assets monitored','1,284']];
return H('Elastic Map','Activity around '+esc(co)+' assets')+`<div class="mp"><div class="card mc"><div class="mb">${Object.keys(TY).map(k=>`<label><input type="checkbox" checked onchange="$('#mv').classList.toggle('no-${k}')"><i style="background:${TY[k][1]}"></i>${TY[k][0]}</label>`).join('')}<div style="cursor:default"><i style="width:18px;height:0;border-top:3px dashed #07264E;border-radius:0"></i>Your assets</div></div>
<!-- PRODUCTION: replace this svg with <iframe src="https://YOUR-KIBANA/app/dashboards#/view/ID?embed=true" style="width:100%;height:100%;border:0"> -->
<svg id="mv" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid slice"><g id="g">${BG}${UP.map(u=>u.svg||'').join('')}${MK}</g></svg>
<div class="zm"><button onclick="zm(.5)">+</button><button onclick="zm(-.5)">−</button></div><div class="tag">Mock Elastic Maps view, ready for Kibana embedding</div></div>
<div><div class="card"><h2>Activity in the last 24 hours</h2>${r.map(x=>`<div class="mt"><span style="background:${x[0]}"></span>${x[1]}<b>${x[2]}</b></div>`).join('')}</div><div class="card"><h2>Selected activity</h2><div id="si">Select a marker on the map to see its details.</div></div>${gis()}</div></div>`},

users:()=>H('User Management','Create and manage users for '+esc(co))+`<div class="card"><h2>Create user</h2><form onsubmit="addU(event)"><div class="row"><div><label>Name</label><input id="un" required></div><div><label>Email</label><input id="ue" type="email" required></div><div><label>Role</label><select id="ur"><option>Operator<option>Admin</select></div><div><label>Status</label><select id="us"><option>Active<option>Disabled</select></div><button class="btn">Add user</button></div></form></div><div class="card"><h2>Users (${U.length})</h2>${TB(['Name','Email','Role','Last login','Logins','Status','Actions'],U.map((u,i)=>[esc(u[0])+(u==me?' <small>(you)</small>':''),esc(u[1]),P(u[2]),u[3],u[5],P(u[4],SC[u[4]]),`<button class="btn o s" onclick="tg(${i})">${u[4]=='Active'?'Disable':'Enable'}</button> <button class="btn o s" onclick="rs(${i})">Reset password</button>`]))}</div>`,

stats:()=>H('Usage Analytics','Usage across all operators in '+esc(co))+KP([...kp(),['Map sessions',st.mp.toLocaleString(),'Up 5% on last month']])+`<div class="two"><div class="card ch"><h2>Usage trend: logins per month</h2>${line(LG(),MO)}</div><div class="card ch"><h2>Searches by type</h2>${bars([6210,4120,5830,2482],['Utility','Excavation','Location','Alerts'])}</div></div><div class="two"><div class="card ch"><h2>Map sessions by week</h2>${bars([1180,1320,1405,1290,1115],['W1','W2','W3','W4','W5'])}</div><div class="card"><h2>Operator activity</h2>${TB(['Operator','Logins','Last login'],U.slice().sort((a,b)=>b[5]-a[5]).map(u=>[esc(u[0]),u[5],u[3]]))}</div></div><div class="card"><h2>Portal activity</h2>${AL(8)}</div>`,

rep:()=>{const a=me[2]=='Admin',d=new Date(),e=d.toISOString().slice(0,10),ks=Object.keys(RT).filter(k=>a||RT[k][3]);d.setUTCDate(d.getUTCDate()-6);if(!ks.includes(RK))RK=ks[0];setTimeout(gen);
return H('Reports','Analytics for '+esc(co))+`<div class="rp"><div class="cl"><input placeholder="Search for reports" oninput="fl(this.value)"><h3>Our analytics</h3>${ks.map(k=>`<a class="ci" data-k="${k}" onclick="gen(1,'${k}')">${RT[k][0]}</a>`).join('')}<h3>Metabase</h3><a class="ci" data-k="mb" onclick="mbv()">Live dashboard (embed)</a></div><div class="card" id="rep"><div class="fw np"><label>From <input id="rf" type="date" value="${d.toISOString().slice(0,10)}" onchange="gen()"></label><label>To <input id="re" type="date" value="${e}" onchange="gen()"></label></div><div id="rb"></div></div></div>`},

sup:()=>H('Support','Raise a request with the LSBUD team')+`<div class="two"><div class="card"><h2>New support request</h2><form onsubmit="sub(event)"><label>Subject</label><input id="sj" required maxlength="100"><label>Description</label><textarea id="sd" rows="6" required></textarea><label>Priority</label><select id="sp"><option>Low<option selected>Medium<option>High<option>Urgent</select><button class="btn" style="margin-top:18px">Submit request</button></form><p class="hint">Requests are sent to enquiries@lsbud.co.uk.</p></div><div class="card"><h2>Ticket history</h2>${TB(['Reference','Subject','Priority','Status','Raised'],T.map(t=>[t[0],esc(t[1]),t[2],P(t[3],SC[t[3]]),t[4]]))}</div></div>`,

set:()=>H('Settings','Organisation, security and integrations')+`<div class="two"><div class="card"><h2>Organisation details</h2><form onsubmit="sv(event)"><label>Company name</label><input id="sn" required value="${esc(co)}"><button class="btn" style="margin:14px 0 18px">Save changes</button></form>${TB(['Membership information',''],[['Type','Asset owner member'],['Membership ID','LSB-0427'],['Renewal date','31/03/2027'],['Administrators',U.filter(u=>u[2]=='Admin').length]])}</div><div class="card"><h2>Security</h2><p>Multi-factor authentication: ${P('Enabled','g')}</p><form onsubmit="cpw(event)"><label>New password</label><input id="np" type="password" minlength="8" required autocomplete="new-password"><button class="btn" style="margin-top:14px">Update password</button></form><p class="hint">Production sign-in will use Microsoft Entra ID, Microsoft Authenticator and SSO.</p></div></div><div class="card"><h2>Integrations</h2>${TB(['Integration','Purpose','Status'],[['Elastic','Activity data and maps',P('Mock data','g')],['Kibana','Embedded dashboards',P('Phase 3','y')],['Metabase','Automated reporting',P('Phase 4','y')],['NUAR','National underground asset data',P('Phase 5','y')],['Microsoft Entra ID','SSO and true MFA',P('Phase 2','y')],['Power BI','Member analytics',P('Future','y')]])}</div>`};

/* app */
function draw(){const a=me[2]=='Admin',x=NAV.find(i=>i[0]==pg);
$('#nv').innerHTML=NAV.filter(i=>a||!i[3]).map(i=>`<a class="${i[0]==pg?'on':''}" onclick="go('${i[0]}')"><span>${i[2]}</span>${i[1]}</a>`).join('');
$('#cn').textContent=co;$('#vs').value=me[2];$('#ui').innerHTML=esc(me[0])+' '+P(me[2]);
$('#mn').innerHTML=x[3]&&!a?H('Access restricted','Only administrators can open '+x[1]+'. Ask your company administrator for access.'):V[pg]();
$('#sb').classList.remove('open');scrollTo(0,0)}
const go=p=>{pg=p||pg;draw()},va=r=>{me=U.find(u=>u[2]==r&&u[4]=='Active')||me;draw()},
out=()=>{me=null;pg='dash';$('#em').value=$('#pw').value='';show('li')};
function login(e){e.preventDefault();const m=$('#em').value.trim().toLowerCase();me=U.find(u=>u[1]==m)||(/oper/.test(m)?U[1]:U[0]);
if(me[4]!='Active')return $('#e1').textContent='This account is disabled. Contact your company administrator.';
$('#e1').textContent='';show('mf');$('#cd').value='';$('#cd').focus()}
function mfa(e){e.preventDefault();if($('#cd').value!='123456')return $('#e2').textContent='Invalid code. The demo code is 123456.';
$('#e2').textContent='';me[3]='Today';me[5]++;st.lg++;log('signed in');pg='dash';show('ap');draw()}

/* map and GIS upload */
const zm=d=>{z=Math.min(3,Math.max(1,z+d));$('#g').style.transform=`scale(${z})`},
inf=i=>{const m=M[i],t=TY[m.t];$('#si').innerHTML=`<span class="pill" style="background:${t[1]};color:${m.t=='e'?'#1c2b3f':'#fff'}">${t[2]}</span><p style="margin-top:10px"><b>${m.r}</b></p><p>${m.d} m from your assets</p><p>Today at ${String(m.h).padStart(2,0)}:00</p><p>Status: ${m.t=='a'?'Open':'Logged'}</p>`},
rmu=i=>{log('removed GIS data '+esc(UP[i].n));UP.splice(i,1);go()};
function kml(t,c){const g=[...new DOMParser().parseFromString(t,'text/xml').getElementsByTagName('coordinates')].map(e=>e.textContent.trim().split(/\s+/).map(p=>p.split(',').map(Number)).filter(p=>p.length>1&&!p.some(isNaN))).filter(l=>l.length);
if(!g.length)return '';const a=g.flat(),x=a.map(p=>p[0]),y=a.map(p=>p[1]),x0=Math.min(...x),y0=Math.min(...y),s=Math.min(780/Math.max(Math.max(...x)-x0,1e-9),440/Math.max(Math.max(...y)-y0,1e-9)),q=p=>[60+(p[0]-x0)*s,510-(p[1]-y0)*s];
return g.map(l=>l.length>1?`<polyline points="${l.map(q).join(' ')}" fill="${c}33" stroke="${c}" stroke-width="3"/>`:`<circle cx="${q(l[0])[0]}" cy="${q(l[0])[1]}" r="6" fill="${c}"/>`).join('')}
async function add(fl){for(const f of fl){const e=f.name.split('.').pop().toLowerCase(),t=FT[e];
if(!t){toast(f.name+' is not supported. Upload a shapefile (.zip), GeoPackage (.gpkg) or KML (.kml).');continue}
if(f.size>1e8){toast(f.name+' is over the 100 MB limit.');continue}
const u={n:f.name,t,z:fz(f.size),s:'Accepted. Preview needs server-side processing'};
if(e=='kml')try{u.svg=kml(await f.text(),['#6f3fa8','#00897b','#8d5524'][UP.length%3]);u.s=u.svg?'Shown on map':'No geometry found'}catch(x){u.s='Could not read this file'}
UP.push(u);log('uploaded GIS data '+esc(f.name))}
go()}

/* users */
function addU(e){e.preventDefault();const nm=$('#un').value.trim(),em=$('#ue').value.trim().toLowerCase(),r=$('#ur').value;
if(U.some(u=>u[1]==em))return toast('A user with that email already exists');
U.push([nm,em,r,'Never',$('#us').value,0]);log(`created ${r.toLowerCase()} ${esc(nm)}`);toast('User created. An invitation email would be sent.');go()}
const tg=i=>{const u=U[i];if(u==me)return toast("You can't disable your own account");u[4]=u[4]=='Active'?'Disabled':'Active';log(`${u[4]=='Active'?'enabled':'disabled'} ${esc(u[0])}`);go()},
rs=i=>{log(`reset the password for ${esc(U[i][0])}`);toast('Password reset link sent to '+U[i][1])};

/* reports (Metabase-style) */
const fl=v=>document.querySelectorAll('.ci').forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(v.toLowerCase())),
on=()=>document.querySelectorAll('.ci').forEach(e=>e.classList.toggle('on',e.dataset.k==RK));
function gen(c,k){if(k)RK=k;const r=RT[RK],f=new Date($('#rf').value),x=new Date($('#re').value),ds=[],o=RK=='oper';
if(f>x)return toast('The From date must be before the To date');
for(let d=new Date(f);d<=x&&ds.length<31;d.setUTCDate(d.getUTCDate()+1))ds.push(fd(d));
const R=RR={t:r[0],h:r[1],r:o?r[2]():ds.map(r[2])},v=R.r.map(w=>w[r[4]]),s=v.reduce((a,b)=>a+b,0),m=Math.max(...v);
if(c){st.rp++;log('ran the '+r[0])}
on();$('.fw').hidden=0;
$('#rb').innerHTML=`<div class="rh"><div><h2 style="font-size:20px;margin:0">${r[0]}</h2><small>${r[5]} Last updated just now.</small></div><div class="np"><button class="btn o s" onclick="csv()">Download CSV</button> <button class="btn s" onclick="window.print()">Download PDF</button></div></div>${KP([['Total '+r[1][r[4]].toLowerCase(),s.toLocaleString(),fd(f)+' to '+fd(x)],['Average per '+(o?'operator':'day'),Math.round(s/v.length).toLocaleString(),'Across '+v.length+(o?' operators':' days')],['Peak',m.toLocaleString(),R.r[v.indexOf(m)][0]]])}<div class="two"><div class="card ch"><h2>${r[1][r[4]]} ${o?'by operator':'by day'}</h2>${o?bars(v,R.r.map(w=>w[0].split(' ')[0])):line(v,R.r.map(w=>w[0].slice(0,5)))}</div><div class="card"><h2>Detail</h2>${TB(R.h,R.r)}</div></div>`}
function mbv(){RK='mb';on();$('.fw').hidden=1;
$('#rb').innerHTML='<h2 style="font-size:20px">Live Metabase dashboard</h2>'+(MBU?`<iframe src="${esc(MBU)}" style="width:100%;height:720px;border:0" title="Metabase dashboard"></iframe>`:`<div class="ph"><b>Metabase is not connected yet</b><p>This area will show your live Metabase dashboards, filtered to ${esc(co)}. Signed embedding needs a security key from LSBUD IT, which is set up once this concept is signed off.</p>${['Portal','API or webhook','Metabase','Report'].map(x=>P(x)).join(' ➜ ')}</div>`)}
const csv=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"',a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([[RR.h,...RR.r].map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download=RR.t.replace(/ /g,'_')+'.csv';a.click()};

/* support and settings */
function sub(e){e.preventDefault();const s=$('#sj').value.trim(),d=$('#sd').value.trim(),p=$('#sp').value,r='LSB-'+(1041+T.length);
T.unshift([r,s,p,'Open',fd(new Date())]);log('raised ticket '+r);
location.href='mailto:enquiries@lsbud.co.uk?subject='+encodeURIComponent(`[${r}] ${s}`)+'&body='+encodeURIComponent(`Priority: ${p}\nRaised by: ${me[0]} (${me[1]}, ${me[2]})\nOrganisation: ${co}\n\n${d}`);
toast(`Ticket ${r} raised and addressed to enquiries@lsbud.co.uk`);go()}
const sv=e=>{e.preventDefault();co=$('#sn').value.trim();log('updated the company settings');toast('Company settings saved');draw()},
cpw=e=>{e.preventDefault();e.target.reset();log('changed their password');toast('Password updated')};
</script></body></html>
